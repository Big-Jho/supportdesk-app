<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>Support Desk Favicon</title>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#2563EB"/>

  <!-- Headset arc -->
  <path d="M58 122 A70 62 0 0 1 198 122" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>

  <!-- Left ear cup -->
  <rect x="42" y="116" width="28" height="44" rx="9" fill="white"/>

  <!-- Right ear cup -->
  <rect x="186" y="116" width="28" height="44" rx="9" fill="white"/>

  <!-- Mic arm -->
  <path d="M70 158 Q54 192 80 200" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Mic tip -->
  <circle cx="90" cy="204" r="9" fill="#60A5FA"/>

  <!-- Chat bubble — extra large -->
  <rect x="108" y="30" width="130" height="88" rx="18" fill="#FBBF24"/>
  <polygon points="126,118 108,148 158,118" fill="#FBBF24"/>

  <!-- Dots in bubble -->
  <circle cx="148" cy="74" r="11" fill="#1E3A8A"/>
  <circle cx="173" cy="74" r="11" fill="#1E3A8A"/>
  <circle cx="198" cy="74" r="11" fill="#1E3A8A"/>

</svg>